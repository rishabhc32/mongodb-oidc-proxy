[SERVICE]
    Flush        1
    Log_Level    debug
    Parsers_File parsers.conf

[INPUT]
    Name         tail
    Tag          mongo_logs
    Path         ${LOG_FILE}
    Parser       mongo_json
    Read_From_Tail On

[FILTER]
    Name         lua
    Match        mongo_logs
    # Set SCRIPT_DIR to the directory containing normalize_mongo_logs.lua.
    script       ${SCRIPT_DIR}/normalize_mongo_logs.lua
    call         normalize


[OUTPUT]
    Name         es
    Match        mongo_logs
    Host         ${ES_HOST}
    Port         ${ES_PORT}
    Index        ${ES_INDEX}
    Suppress_Type_Name On
    Replace_Dots On
