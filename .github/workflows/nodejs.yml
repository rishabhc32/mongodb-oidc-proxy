on:
  push:
    branches: [master]
  pull_request:

name: CI

# A new push to a branch cancels its runs still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [22.x, 24.x]
    runs-on: ${{matrix.os}}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # for the coverage comment
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Dependencies
        run: npm ci
      - name: Test
        run: npm test
      # One comment per pull request, updated on each push. Skipped for forks and
      # Dependabot, whose pull requests get a read-only token
      - name: Comment coverage on the pull request
        if: >-
          matrix.node-version == '24.x' && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### Coverage'; echo '```'; npx c8 report --reporter=text; echo '```'; } > coverage.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file coverage.md --edit-last --create-if-none

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build proxy image
        run: docker build -t mongodb-oidc-proxy .
      - name: Check proxy image starts
        run: docker run --rm mongodb-oidc-proxy --help
      - name: Build Vector image
        run: docker build -t mongodb-oidc-proxy-vector ops/vector
      - name: Validate and test Vector config
        run: |
          mkdir -p "$RUNNER_TEMP/secrets"
          printf 'ci-key' > "$RUNNER_TEMP/secrets/es_api_key"
          chmod 644 "$RUNNER_TEMP/secrets/es_api_key"
          docker run --rm -e ES_ENDPOINT=http://localhost:9200 \
            -v "$RUNNER_TEMP/secrets:/run/secrets:ro" \
            mongodb-oidc-proxy-vector validate --skip-healthchecks /etc/vector/vector.yaml
          docker run --rm -e ES_ENDPOINT=http://localhost:9200 \
            -v "$RUNNER_TEMP/secrets:/run/secrets:ro" \
            -v "$PWD/test/vector:/etc/vector/tests:ro" \
            mongodb-oidc-proxy-vector test /etc/vector/vector.yaml /etc/vector/tests/normalize.test.yaml
